ShortDescription: Configure a Razer Viper V3 Pro on Windows without Razer Synapse.
Description: |-
  One portable executable that writes DPI stages, polling rate, button assignments, macros, sensor and power settings into the onboard memory of a Razer Viper V3 Pro, wired or through its HyperSpeed / HyperPolling dongle. It replaces Razer Synapse 4 with no installer, no services and no account: run it once, uninstall Synapse, and the mouse keeps the settings on any PC. The same file is a tray app (battery, DPI stage and polling rate, per-game profiles, macro playback), a settings window and a command-line tool. Other Razer mice open read-only until an owner verifies them. Not affiliated with Razer Inc.
