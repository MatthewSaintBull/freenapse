name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (Windows, GNU toolchain)
    runs-on: windows-latest
    env:
      # Same toolchain as rust-toolchain.toml. Set here too because rustup 1.28.0/1.28.1
      # reject a host tuple in the file's channel field; the variable takes precedence.
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --release --locked

      - name: Upload the executable
        uses: actions/upload-artifact@v4
        with:
          name: freenapse-windows-x64
          path: target/release/freenapse.exe
          if-no-files-found: error

  release:
    name: Attach the executable to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: freenapse-windows-x64

      - name: Checksum
        run: sha256sum freenapse.exe > freenapse.exe.sha256

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            freenapse.exe
            freenapse.exe.sha256
          generate_release_notes: true

      # freenapse.app rebuilds its changelog and download button from the
      # releases. It also rebuilds once a day on its own, so this step only
      # makes the site current within minutes instead of hours. It needs a
      # fine-grained token with "Contents: read and write" on freenapse-web,
      # stored as the FREENAPSE_WEB_TOKEN secret; without it the step is skipped.
      - name: Tell freenapse.app to rebuild
        env:
          WEB_TOKEN: ${{ secrets.FREENAPSE_WEB_TOKEN }}
        if: ${{ env.WEB_TOKEN != '' }}
        run: >
          curl -fsS -X POST
          -H "Accept: application/vnd.github+json"
          -H "Authorization: Bearer $WEB_TOKEN"
          https://api.github.com/repos/MatthewSaintBull/freenapse-web/dispatches
          -d '{"event_type":"release"}'
