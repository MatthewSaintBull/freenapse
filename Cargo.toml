[package]
name = "freenapse"
version = "0.3.0"
edition = "2024"
authors = ["Matteo Santoro <m.santoro1997@gmail.com>"]
description = "Configure a Razer mouse from Windows without Synapse: onboard settings, tray app and a native settings window"
license = "MIT"
readme = "README.md"
keywords = ["razer", "mouse", "hid", "windows", "synapse"]
categories = ["hardware-support", "command-line-utilities"]
repository = "https://github.com/MatthewSaintBull/freenapse"
homepage = "https://freenapse.app"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Devices_HumanInterfaceDevice", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Diagnostics_Debug", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation", "Win32_UI_HiDpi", "Win32_Graphics_Dwm", "Win32_System_Registry", "Win32_System_Console", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_System_Com", "Win32_Graphics_GdiPlus", "Win32_Networking_WinHttp", "Win32_System_Power"] }

[[bin]]
name = "freenapse"
path = "src/main.rs"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
